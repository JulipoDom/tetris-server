[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetris-versus-server"
version = "0.1.0"
description = "Local single-match Tetris Versus server boilerplate"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tetris_server = "tetris_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

